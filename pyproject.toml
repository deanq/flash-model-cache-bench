[project]
name = "flash-model-cache-bench"
version = "0.1.0"
description = "Benchmark Hugging Face model-loading strategies on Runpod Flash (runpod.apps) serverless GPUs"
requires-python = ">=3.11"
dependencies = [
    "runpod==2.1.0",
    "httpx>=0.27",
    "pip>=24",  # `rp flash deploy` vendors dependencies with pip from this venv
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "worker"]
